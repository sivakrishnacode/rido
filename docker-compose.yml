# Rido backend stack.
#   docker compose up -d                 # postgres + redis + api + admin panel
#   docker compose --profile tools up -d # + Adminer (DB) and Redis Insight
name: rido

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rido}
      POSTGRES_DB: ${POSTGRES_DB:-rido}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rido} -d ${POSTGRES_DB:-rido}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: rido-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rido}:${POSTGRES_PASSWORD:-rido}@postgres:5432/${POSTGRES_DB:-rido}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_ON_START: ${SEED_ON_START:-true}
      # Server key for Places / Geocoding / Routes (restrict by IP). Empty = local fallback.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      UPLOAD_DIR: /data/uploads
      # Private bucket for KYC documents / images (credentials from the EC2 instance role). Empty = the uploads volume.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-3000}:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
    image: rido-admin:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-side only: the browser never talks to the API directly.
      API_URL: http://api:3000/v1
      # Cookies get the Secure flag in production; set to false only for plain-HTTP deployments.
      COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
    ports:
      - "${ADMIN_PORT:-3001}:3001"

  adminer:
    image: adminer:5
    profiles: ["tools"]
    depends_on: [postgres]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  redis-insight:
    image: redis/redisinsight:latest
    profiles: ["tools"]
    depends_on: [redis]
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    volumes:
      - redis-insight-data:/data

volumes:
  uploads:
  postgres-data:
  redis-data:
  redis-insight-data:
